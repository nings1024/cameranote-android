[versions]
agp = "8.13.2"
kotlin = "2.3.0"
composeBom = "2025.12.01"
androidx-core = "1.17.0"
androidx-activity = "1.12.2"
androidx-testExt = "1.3.0"
androidx-espresso = "3.7.0"
junit = "4.13.2"
camera = "1.5.2"
accompanist-permissions = "0.37.3"
concurrent-futures-ktx = "1.3.0"
room = "2.8.4"
koin = "4.1.1"
navigationCompose = "2.9.6"
coil = "3.3.0"
telephoto = "0.18.0"

[libraries]
# --- Compose（版本由 BOM 统一管理）---
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-core = { module = "androidx.compose.ui:ui" }
compose-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-toolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-testManifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons = { module = "androidx.compose.material:material-icons-extended" }

# --- AndroidX 基础 ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
concurrent-futures-ktx = { module = "androidx.concurrent:concurrent-futures-ktx", version.ref = "concurrent-futures-ktx" }

# --- 相机 ---
camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camera" }

# --- 权限 ---
permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist-permissions" }

# --- Room ---
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# --- Koin ---
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

# --- Navigation ---
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# --- 图片 ---
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
telephoto-zoomable = { module = "me.saket.telephoto:zoomable-image-coil3", version.ref = "telephoto" }

# --- 测试 ---
junit = { module = "junit:junit", version.ref = "junit" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }

[bundles]
camera = ["camera-view", "camera-camera2", "camera-lifecycle", "camera-core"]
room = ["room-runtime", "room-ktx"]
koin = ["koin-core", "koin-android", "koin-androidx-compose"]
nav = ["navigation-compose"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
